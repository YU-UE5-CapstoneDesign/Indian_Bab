[/Script/Engine.RendererSettings]
; 반사: Screen Space(2)는 스테레오 두 번째 눈(오른쪽)에서 깨짐(매지엔타) 유발 + 비용 → 비활성(0).
;   반사는 레벨의 Reflection Capture / Skylight로 대체됨. 오른쪽 눈 보라색 진단 차원.
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=True
; GI: Screen Space GI(2)도 스테레오 두 번째 눈 아티팩트원 + 비용 → 비활성(0).
;   간접광은 Skylight/Ambient로 대체(룩이 약간 평평). 보라색 잡히면 유지, 룩 아쉬우면 2로 복귀.
r.DynamicGlobalIlluminationMethod=0
r.Lumen.TraceMeshSDFs=0
; 그림자: Virtual Shadow Maps(1)는 VR 스테레오에서 비용 큼 → 일반 섀도우맵(0)으로.
; 그림자 자체는 유지됨(품질만 완화). 컨택트 섀도우 디테일이 아쉬우면 1로 복귀.
r.Shadow.Virtual.Enable=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True
SkeletalMesh.UseExperimentalChunking=1
r.DefaultFeature.AutoExposure=False
; AA: TSR(4) 사용. 우측 눈 아티팩트는 TSR이 아니라 Screen Space GI/반사 버그였고(위에서 해결),
;   TSR이 TAA보다 글자/디테일 선명도가 월등 → VR 텍스트 가독성 위해 TSR 유지.
r.AntiAliasingMethod=4
; VR 모션블러 제거: 멀미 유발 + GPU 낭비. 카드 게임이라 손실 0.
r.DefaultFeature.MotionBlur=False
; 포스트 샤프닝 OFF: 샤프닝은 고주파(가는 엣지/수레바퀴 살)를 강조해 기하 엣지 앨리어싱을 증폭.
;   글자 선명도는 슈퍼샘플링(150+)이 받쳐주므로 0으로. 글자가 다시 무뎌지면 0.15까지만 소폭.
r.Tonemapper.Sharpen=0.0

[/Script/Engine.RendererSettings]
r.Streaming.PoolSize=0
r.PSOPrecaching=0
r.Mobile.UseHWsRGBEncoding=True
r.AllowGlobalClipPlane=True

; ─────────────────────────────────────────────────────────────
; VR HMD 렌더타깃 해상도 (OpenXR). vr.PixelDensity는 UE5.5부터 deprecated → 이걸로 대체.
;   100.0 = "ideal"(권장) 해상도인데, 이게 패널 풀 해상도보다 낮아 패키지 빌드에서 뿌옇게 보임
;   (에디터 VR Preview는 풀 HMD 해상도로 렌더라 선명 → 에디터/패키지 괴리의 원인).
;   160 = 슈퍼샘플링(권장의 1.6배). 기하 엣지 앨리어싱(수레바퀴 살·가는 윤곽선 끓음)엔
;   슈퍼샘플링이 유일하게 확실한 레버라 150→160으로 상향(서브픽셀 형상을 더 해상).
;   너무 끊기면 150→140으로. 엣지 끓음이 그래도 거슬리면 175까지(이 증상엔 200도 정당화됨).
; ─────────────────────────────────────────────────────────────
[ConsoleVariables]
xr.SecondaryScreenPercentage.HMDRenderTarget=160.0
; 포스트프로세스 비용 완화
; (SSR/SSGI 품질 CVar은 위에서 Screen Space GI/반사를 0으로 끈 뒤 무의미해져 제거)
r.MotionBlurQuality=0  ; 모션블러 런타임 완전 차단 (DefaultFeature와 이중 안전)
r.BloomQuality=4       ; 블룸 한 단계↓ (5 기본 → 4, 시각 차이 거의 없음)

; ── 자글거림(shimmer/엣지·텍스처 앨리어싱) 완화 ── (모두 [ConsoleVariables]=0x09 우선순위라
;   인게임 성능옵션(scalability=0x01)에 안 덮임 = 게임 시작 시 고정 적용, 콘솔 불필요)
; TSR 히스토리 해상도 배율: 100 기본 → 200(Epic/Cinematic 프리셋값). Nyquist 정리 기반
;   재투영 디테일 안정성↑ = 엣지/스펙큘러 끓음 억제.
r.TSR.History.ScreenPercentage=200
; TSR 히스토리 누적 샘플 수: 16 기본 → 32(최대). 가는 형상/엣지의 시간 안정성↑ = 끓음 억제.
r.TSR.History.SampleCount=32
; TSR 안티플리커 휴리스틱 강제 ON: 루마 진동(moire/끓음) 감지해 안정화.
;   기본은 High/Epic scalability에서만 켜지므로 명시 고정.
r.TSR.ShadingRejection.Flickering=1
; TSR 히스토리 리젝션 시 공간 AA 품질 최대(3). 저해상도 영역 앨리어싱 은폐.
r.TSR.RejectionAntiAliasingQuality=3
; 비등방 필터링: 기본 4 → 16. 테이블/바닥 텍스처를 비스듬히 볼 때 자글거림 제거(저비용).
r.MaxAnisotropy=16

