[/Script/Engine.RendererSettings]
; 반사·GI: Lumen(1). PC·VR 공통. 끄면(0) 표면 스페큘러·간접광이 불안정해 오브젝트 표면이 자글거린다.
;   Screen Space(2)는 VR 스테레오 두 번째 눈(오른쪽)에서 깨짐(매지엔타)을 유발하므로 쓰지 않는다.
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.Lumen.TraceMeshSDFs=0
; 그림자: Virtual Shadow Maps(1). 일반 섀도우맵(0)은 그림자 경계가 끓어 표면이 자글거린다. PC·VR 공통.
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True
SkeletalMesh.UseExperimentalChunking=1
r.DefaultFeature.AutoExposure=False
; AA: TSR(4) 사용. 우측 눈 아티팩트는 TSR이 아니라 Screen Space GI/반사 버그였고(위에서 해결),
;   TSR이 TAA보다 글자/디테일 선명도가 월등 → VR 텍스트 가독성 위해 TSR 유지.
r.AntiAliasingMethod=4
; VR 모션블러 제거: 멀미 유발 + GPU 낭비. 카드 게임이라 손실 0.
r.DefaultFeature.MotionBlur=False
; 포스트 샤프닝 OFF: 샤프닝은 고주파(가는 엣지/수레바퀴 살)를 강조해 기하 엣지 앨리어싱을 증폭.
;   글자 선명도는 슈퍼샘플링(150+)이 받쳐주므로 0으로. 글자가 다시 무뎌지면 0.15까지만 소폭.
r.Tonemapper.Sharpen=0.0

[/Script/Engine.RendererSettings]
r.Streaming.PoolSize=0
r.PSOPrecaching=0
r.Mobile.UseHWsRGBEncoding=True
r.AllowGlobalClipPlane=True

; ─────────────────────────────────────────────────────────────
; VR HMD 렌더타깃 해상도 (OpenXR). vr.PixelDensity는 UE5.5부터 deprecated → 이걸로 대체.
;   100 = 기기 권장 해상도. 올리면 슈퍼샘플링으로 더 또렷해지지만 픽셀 수가 제곱으로 늘어
;   (130 → 1.69배, 160 → 2.56배) GPU 비용이 그만큼 커지고 VR 프레임이 떨어진다.
;   표면 자글거림은 해상도가 아니라 GI·반사·그림자(위 RendererSettings)로 잡는다.
; ─────────────────────────────────────────────────────────────
[ConsoleVariables]
xr.SecondaryScreenPercentage.HMDRenderTarget=100.0
; 포스트프로세스 비용 완화
r.MotionBlurQuality=0  ; 모션블러 런타임 완전 차단 (DefaultFeature와 이중 안전)
; Bloom quality follows the selected post-process quality (DefaultScalability.ini).

; ── 자글거림(shimmer/엣지·텍스처 앨리어싱) 완화 ── (모두 [ConsoleVariables]=0x09 우선순위라
;   인게임 성능옵션(scalability=0x01)에 안 덮임 = 게임 시작 시 고정 적용, 콘솔 불필요)
; TSR 히스토리 해상도 배율: 100(출력 해상도와 같은 크기). 지원 범위 100~200.
;   올리면 움직일 때 가는 디테일이 더 또렷하고 안정적이지만 히스토리 버퍼가 최대 4배(200)로 커져
;   VR(두 눈 × HMD 해상도)에서 VRAM을 크게 차지한다.
r.TSR.History.ScreenPercentage=100
; TSR 히스토리 누적 샘플 수: 16 기본 → 32(최대). 가는 형상/엣지의 시간 안정성↑ = 끓음 억제.
r.TSR.History.SampleCount=32
; TSR 안티플리커 휴리스틱 강제 ON: 루마 진동(moire/끓음) 감지해 안정화.
;   기본은 High/Epic scalability에서만 켜지므로 명시 고정.
r.TSR.ShadingRejection.Flickering=1
; TSR 히스토리 리젝션 시 공간 AA 품질 최대(3). 저해상도 영역 앨리어싱 은폐.
r.TSR.RejectionAntiAliasingQuality=3
; 비등방 필터링: 기본 4 → 16. 테이블/바닥 텍스처를 비스듬히 볼 때 자글거림 제거(저비용).
; Texture quality controls anisotropy; High retains 16 in DefaultScalability.ini.
; TSR 자동 텍스처 밉 보정 끔(0). 기본은 내부 해상도가 낮을수록 더 선명한 밉을 쓰는데
;   (PC 내부 61%에서 약 -1.0, VR 100%에서 -0.3), 먼 바닥처럼 무늬가 픽셀보다 촘촘한 면이 깜빡인다.
r.ViewTextureMipBias.Min=0
r.ViewTextureMipBias.Offset=0

; ── 그래픽 품질 ── 0=낮음 1=중간 2=높음 3=최상.
; 그림자·텍스처·이펙트·후처리는 옵션 메뉴/SettingSaveGame에서 관리한다.
; 이 항목들은 ConsoleVariables에서 고정하지 않아야 사용자 선택이 적용된다.
; GI·반사 등 아래 항목은 기존 품질을 유지한다. 낮은 GI 등급은 Lumen을 끄므로 노출하지 않는다.
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
; Shadow/PostProcess/Texture/Effects quality are saved user options.
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=2
sg.FoliageQuality=2
sg.ShadingQuality=2
sg.LandscapeQuality=2
; 화면 비율: 0 = 아래 [Rendering.AutoScreenPercentage] 표를 따른다. 저장된 비율이 남아 있어도 이쪽으로 되돌린다.
;   여기에 숫자를 직접 넣으면 VR까지 그 비율로 바뀌므로 0으로 두고 표에서 조정한다.
sg.ResolutionQuality=0
r.ScreenPercentage=0

; PC(모니터) 화면의 내부 렌더 해상도 = 디스플레이 해상도의 80%. 이 크기로 그린 뒤 TSR이 화면 크기로 키운다.
;   각 쌍은 "디스플레이 세로 해상도 → 렌더 세로 해상도"이고 세 점 모두 0.8배라 어느 해상도에서나 80%가 된다.
;   낮추면 가볍지만 촘촘한 무늬(먼 바닥 등)가 깜빡이고, 올리면 GPU 시간과 VRAM이 픽셀 수만큼 는다.
;   VR은 이 표를 쓰지 않고 항상 100%로 렌더한다.
[Rendering.AutoScreenPercentage]
MinDisplayResolution=720
MinRenderingResolution=576
MidDisplayResolution=2160
MidRenderingResolution=1728
MaxDisplayResolution=4320
MaxRenderingResolution=3456

